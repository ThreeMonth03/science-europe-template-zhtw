name: Candidate build and unit checks (not visual acceptance)

on:
  push:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

# Cancel superseded branch revisions; manual runs retain independent evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [english-unit, chinese-unit, integration]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: zh
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            zh/requirements-dev.txt
            zh/pipeline.yml
      - name: Read exact source locks
        id: locks
        run: |
          python -m pip install PyYAML==6.0.3
          python - <<'PY'
          import os, yaml
          from pathlib import Path
          config = yaml.safe_load(Path('zh/pipeline.yml').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('source', 'tooling'):
                  commit = config[key]['commit']
                  assert len(commit) == 40 and all(c in '0123456789abcdef' for c in commit)
                  output.write(f'{key}={commit}\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: ThreeMonth03/science-europe-template
          ref: ${{ steps.locks.outputs.source }}
          path: english
          fetch-depth: 0  # Package timestamps require actual input history.
      - name: Install isolated English dependencies
        working-directory: english
        run: |
          python -m venv "$RUNNER_TEMP/english-check-venv"
          "$RUNNER_TEMP/english-check-venv/bin/python" -m pip install -r requirements-dev.txt
          make knowledge-models PYTHON="$RUNNER_TEMP/english-check-venv/bin/python"
      - uses: actions/checkout@v4
        with:
          repository: ThreeMonth03/dsw-document-template-tool
          ref: ${{ steps.locks.outputs.tooling }}
          path: tooling
      - name: Install pinned checkout and pilot dependencies
        run: |
          python -m venv tooling/.venv
          tooling/.venv/bin/pip install -e './tooling[dev]' -r zh/requirements-dev.txt
      - name: Check current locked English PO source with its declared dependencies
        if: matrix.group == 'english-unit'
        working-directory: english
        env:
          PYTHONPATH: tests:scripts
        run: |
          mkdir -p outputs
          make verify DSW_TDK="$RUNNER_TEMP/english-check-venv/bin/dsw-tdk"
          "$RUNNER_TEMP/english-check-venv/bin/python" -m unittest -v \
            tests.test_current_behavior.CurrentI18nTests \
            tests.test_current_behavior.CurrentBudgetLayoutTests \
            tests.test_q3_storage_groups \
            tests.test_derived_submission_headings.DerivedSubmissionHeadingsTests \
            tests.test_document_metadata.DocumentMetadataTests \
            2>&1 | tee outputs/current-unit.log
          "$RUNNER_TEMP/english-check-venv/bin/python" -m unittest discover -s experiments/legacy434 -v \
            2>&1 | tee outputs/current-compat434-unit.log
      - name: Check current PO builder, candidate lifecycle and package documentation
        if: matrix.group == 'chinese-unit'
        working-directory: zh
        env:
          DSW_ENGLISH_CHECKOUT: ${{ github.workspace }}/english
        run: |
          mkdir -p outputs/ci
          ../tooling/.venv/bin/python -m unittest discover -s tests -v \
            2>&1 | tee outputs/ci/current-po-unit.log
      - name: Build exact locked bilingual packages
        if: matrix.group == 'integration'
        working-directory: zh
        run: |
          SE_BUILD_DIR=$(../tooling/.venv/bin/python scripts/build.py --english ../english --tooling ../tooling)
          echo "SE_BUILD_DIR=$SE_BUILD_DIR" >> "$GITHUB_ENV"
      - name: Check current bilingual answers on the prepared packages
        if: matrix.group == 'integration'
        working-directory: zh
        run: |
          ../tooling/.venv/bin/python ../english/scripts/check_current.py --build "$SE_BUILD_DIR" --output "$SE_BUILD_DIR/current-behavior.json"
      - name: Check authoritative PO against official 4.35 extraction
        if: matrix.group == 'integration'
        working-directory: zh
        run: |
          ../tooling/.venv/bin/python ../english/scripts/check_catalog.py --po locales/zh-Hant.po \
            | tee "$SE_BUILD_DIR/catalog-check.json"
      - name: Preserve candidate and diagnostics even after failure
        if: always() && matrix.group == 'integration'
        uses: actions/upload-artifact@v4
        with:
          name: current-candidate-not-a-release
          retention-days: 14
          path: |
            zh/outputs/ci/
            zh/outputs/build-*/*.zip
            zh/outputs/build-*/*.json
      - name: Preserve current unit execution counts and failures
        if: always() && matrix.group != 'integration'
        uses: actions/upload-artifact@v4
        with:
          name: current-${{ matrix.group }}-reports
          retention-days: 14
          path: |
            english/outputs/*.log
            zh/outputs/ci/*.log
      - name: State acceptance boundary
        if: always()
        working-directory: zh
        run: |
          echo "Profile: current; lane: ${{ matrix.group }}; Chinese source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "English source: $(git -C ../english rev-parse HEAD); Tool: $(git -C ../tooling rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Build checks do not establish full DMP, PDF or Microsoft Word acceptance. See docs/testing.md.' >> "$GITHUB_STEP_SUMMARY"

  # Stable required-check identity; every current group must succeed.
  build:
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check group to succeed
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success
