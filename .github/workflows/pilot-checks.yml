name: Candidate build and unit checks (not visual acceptance)

on:
  push:
    branches: [experiment/bilingual-pilot, 'feat/**', 'fix/**', 'upgrade/**']
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

# Do not spend another hour checking a superseded revision of the same branch.
# Manual runs have their own group so they remain available as evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [english-unit, chinese-unit, integration, reading, native]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: zh
          fetch-depth: 0  # The translation regression checks the exact prior committed tree.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            zh/requirements-dev.txt
            zh/pipeline.yml
      - name: Install PDF inspection tools for frozen native regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Read exact source locks
        id: locks
        run: |
          python -m pip install PyYAML==6.0.3
          python - <<'PY'
          import os, yaml
          from pathlib import Path
          config = yaml.safe_load(Path('zh/pipeline.yml').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('source', 'tooling'):
                  commit = config[key]['commit']
                  assert len(commit) == 40 and all(c in '0123456789abcdef' for c in commit)
                  output.write(f'{key}={commit}\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: ThreeMonth03/science-europe-template
          ref: ${{ steps.locks.outputs.source }}
          path: english
          fetch-depth: 0  # Package timestamps require actual input history, not a shallow boundary.
      - name: Install isolated English dependencies
        working-directory: english
        run: |
          python -m venv "$RUNNER_TEMP/english-check-venv"
          "$RUNNER_TEMP/english-check-venv/bin/python" -m pip install -r requirements-dev.txt
          # Every parallel group starts fresh; do not rely on the unit lane's cache.
          make knowledge-models PYTHON="$RUNNER_TEMP/english-check-venv/bin/python"
      - uses: actions/checkout@v4
        with:
          repository: ThreeMonth03/dsw-document-template-tool
          ref: ${{ steps.locks.outputs.tooling }}
          path: tooling
      - name: Install pinned checkout and pilot dependencies
        run: |
          python -m venv tooling/.venv
          tooling/.venv/bin/pip install -e './tooling[dev]' -r zh/requirements-dev.txt
      - name: Check current source and historical Word boundary before long tests
        working-directory: zh
        run: ../tooling/.venv/bin/python scripts/word_empty_section_integration.py --english ../english --preflight-only
      - name: Check locked English source with only its declared dependencies
        if: matrix.group == 'english-unit'
        working-directory: english
        run: make check PYTHON="$RUNNER_TEMP/english-check-venv/bin/python" DSW_TDK="$RUNNER_TEMP/english-check-venv/bin/dsw-tdk"
      - name: Check Chinese unit and translation contracts
        if: matrix.group == 'chinese-unit'
        working-directory: zh
        run: |
          ../tooling/.venv/bin/python -m unittest discover -s tests -v
      - name: Build exact locked bilingual packages
        if: matrix.group == 'integration' || matrix.group == 'reading' || matrix.group == 'native'
        working-directory: zh
        run: |
          SE_BUILD_DIR=$(../tooling/.venv/bin/python scripts/build.py --english ../english --tooling ../tooling)
          echo "SE_BUILD_DIR=$SE_BUILD_DIR" >> "$GITHUB_ENV"
      - name: Check current bilingual answers on the prepared packages
        if: matrix.group == 'integration'
        working-directory: zh
        run: |
          # Land together with the exact English source-lock update; never skip
          # this check when the locked source is missing the shared runner.
          ../tooling/.venv/bin/python ../english/scripts/check_current.py --build "$SE_BUILD_DIR" --output "$SE_BUILD_DIR/current-behavior.json"
      - name: Check package integrity and historical integration contracts
        if: matrix.group == 'integration'
        working-directory: zh
        run: |
          # Validate actual 0.3.51 packages before every historical projection.
          ../tooling/.venv/bin/python scripts/q3_policy_prose_integration.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/word_empty_section_integration.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/reuse_preparation_integration.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/empty_section_spacing_integration.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/submission_flow_integration.py --build "$SE_BUILD_DIR" --english ../english
          # Exact 0.3.46 and older proofs remain separate from current behavior.
          ../tooling/.venv/bin/python scripts/full_km_followups_integration.py --build "$SE_BUILD_DIR" --english ../english
          # Fail fast on the historic prepared-source hash gates; the complete
          # Q13 engine check still runs below. Never replace it with preflight.
          ../tooling/.venv/bin/python ../english/scripts/probe_identifier_spacing.py --source-dir "$SE_BUILD_DIR/translated" --preflight-only --output "$SE_BUILD_DIR/identifier-spacing-preflight.json"
      - name: Check translated reading and historical scopes
        if: matrix.group == 'reading'
        working-directory: zh
        run: |
          ../tooling/.venv/bin/python scripts/probe_format_translation.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_sharing_translation.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_preservation_translation.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_answer_states.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_repository_reading.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_contact_translation.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_paper_translation.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_identifier_translation.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_missing_info_translation.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_personal_data_translation.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_missing_info_group.py --build "$SE_BUILD_DIR" --english ../english
          # Preserve the exact 0.3.45 and earlier oracles on verified historical views.
          ../tooling/.venv/bin/python scripts/submission_reading_integration.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_submission_reading.py --build "$SE_BUILD_DIR" --english ../english
          # Retain the unchanged 0.3.44 oracle on its byte-verified historical view.
          ../tooling/.venv/bin/python scripts/probe_submission_preview.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_metadata_gap_prose_scope.py --build "$SE_BUILD_DIR" --english ../english --output-profiles --preservation-reading --short-resources --resource-prose --short-resource-rows --budget-grouping --submission-preview
          ../tooling/.venv/bin/python scripts/probe_resource_prose_translation.py --build "$SE_BUILD_DIR" --english ../english
      - name: Check all existing PDF and DOCX regressions (two language lanes)
        if: matrix.group == 'native'
        working-directory: zh
        timeout-minutes: 40
        run: |
          mkdir -p outputs/ci
          bash scripts/check_native_regressions.sh english "$SE_BUILD_DIR" > outputs/ci/native-english.log 2>&1 &
          SE_EN_PID=$!
          bash scripts/check_native_regressions.sh chinese "$SE_BUILD_DIR" > outputs/ci/native-chinese.log 2>&1 &
          SE_ZH_PID=$!
          SE_NATIVE_STATUS=0
          wait "$SE_EN_PID" || SE_NATIVE_STATUS=1
          wait "$SE_ZH_PID" || SE_NATIVE_STATUS=1
          if [ "$SE_NATIVE_STATUS" -ne 0 ]; then
            tail -n 60 outputs/ci/native-english.log outputs/ci/native-chinese.log
          fi
          exit "$SE_NATIVE_STATUS"
      - name: Preserve candidate and diagnostics even after failure
        if: always() && matrix.group == 'integration'
        uses: actions/upload-artifact@v4
        with:
          name: experimental-candidate-not-a-release
          retention-days: 14
          path: |
            zh/outputs/ci/
            zh/outputs/build-*/*.zip
            zh/outputs/build-*/*.json
      - name: Preserve reading and native diagnostics even after failure
        if: always() && (matrix.group == 'reading' || matrix.group == 'native')
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports-${{ matrix.group }}
          retention-days: 14
          path: |
            zh/outputs/ci/
            zh/outputs/build-*/*.json
      - name: State acceptance boundary
        if: always()
        working-directory: zh
        run: |
          for SE_TIMINGS in outputs/ci/native-english.tsv outputs/ci/native-chinese.tsv; do
            if [ -f "$SE_TIMINGS" ]; then
              echo "### $SE_TIMINGS" >> "$GITHUB_STEP_SUMMARY"
              echo '' >> "$GITHUB_STEP_SUMMARY"
              echo '| Probe | Seconds | Exit code |' >> "$GITHUB_STEP_SUMMARY"
              echo '| --- | ---: | ---: |' >> "$GITHUB_STEP_SUMMARY"
              awk -F '\t' 'NR > 1 {printf "| %s | %s | %s |\n", $1, $2, $3}' "$SE_TIMINGS" >> "$GITHUB_STEP_SUMMARY"
              echo '' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo 'Build checks do not establish full DMP, PDF or Microsoft Word acceptance. See docs/pilot-results.md.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Historic 0.3.34 Q5 failure is retained. The bounded 0.3.35 native fix and its remaining acceptance limits are documented in docs/q5-word-join.md.' >> "$GITHUB_STEP_SUMMARY"

  # Stable required-check identity; all five groups must actually succeed.
  build:
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check group to succeed
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success
