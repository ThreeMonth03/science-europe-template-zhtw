name: Candidate build and unit checks (not visual acceptance)

on:
  push:
    branches: [experiment/bilingual-pilot, 'feat/**', 'fix/**', 'upgrade/**']
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zh
          fetch-depth: 0  # The translation regression checks the exact prior committed tree.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF inspection tools for frozen native regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Read exact source locks
        id: locks
        run: |
          python -m pip install PyYAML==6.0.3
          python - <<'PY'
          import os, yaml
          from pathlib import Path
          config = yaml.safe_load(Path('zh/pipeline.yml').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('source', 'tooling'):
                  commit = config[key]['commit']
                  assert len(commit) == 40 and all(c in '0123456789abcdef' for c in commit)
                  output.write(f'{key}={commit}\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: ThreeMonth03/science-europe-template
          ref: ${{ steps.locks.outputs.source }}
          path: english
          fetch-depth: 0  # Package timestamps require actual input history, not a shallow boundary.
      - name: Check locked English source with only its declared dependencies
        working-directory: english
        run: |
          python -m venv "$RUNNER_TEMP/english-check-venv"
          "$RUNNER_TEMP/english-check-venv/bin/python" -m pip install -r requirements-dev.txt
          make check PYTHON="$RUNNER_TEMP/english-check-venv/bin/python" DSW_TDK="$RUNNER_TEMP/english-check-venv/bin/dsw-tdk"
      - uses: actions/checkout@v4
        with:
          repository: ThreeMonth03/dsw-document-template-tool
          ref: ${{ steps.locks.outputs.tooling }}
          path: tooling
      - name: Install pinned checkout and pilot dependencies
        run: |
          python -m venv tooling/.venv
          tooling/.venv/bin/pip install -e './tooling[dev]' -r zh/requirements-dev.txt
      - name: Build a locked candidate and check lifecycle gates
        working-directory: zh
        run: |
          ../tooling/.venv/bin/python -m unittest discover -s tests -v
          SE_BUILD_DIR=$(../tooling/.venv/bin/python scripts/build.py --english ../english --tooling ../tooling)
          # Fail fast on the historic prepared-source hash gates; the complete
          # Q13 engine check still runs below. Never replace it with preflight.
          ../tooling/.venv/bin/python ../english/scripts/probe_identifier_spacing.py --source-dir "$SE_BUILD_DIR/translated" --preflight-only --output "$SE_BUILD_DIR/identifier-spacing-preflight.json"
          ../tooling/.venv/bin/python scripts/probe_format_translation.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_sharing_translation.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_preservation_translation.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_answer_states.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_repository_reading.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_contact_translation.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_paper_translation.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_identifier_translation.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_missing_info_translation.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_personal_data_translation.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_missing_info_group.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python ../english/scripts/probe_budget_word.py --output "$SE_BUILD_DIR/budget-word-probe.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_q8_word.py --output "$SE_BUILD_DIR/q8-word-probe.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_q9_word.py --output "$SE_BUILD_DIR/q9-word-probe.json"
          # Validate the actual 0.3.44 package before exact projections into all older gates.
          ../tooling/.venv/bin/python scripts/check_submission_preview_integration.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_submission_preview.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python scripts/probe_metadata_gap_prose_scope.py --build "$SE_BUILD_DIR" --english ../english --output-profiles --preservation-reading --short-resources --resource-prose --short-resource-rows --budget-grouping --submission-preview
          ../tooling/.venv/bin/python scripts/probe_resource_prose_translation.py --build "$SE_BUILD_DIR" --english ../english
          ../tooling/.venv/bin/python ../english/scripts/probe_short_resource_rows.py --source-dir "$SE_BUILD_DIR/en" --engine --output "$SE_BUILD_DIR/short-resource-rows-engine-en.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_short_resource_rows.py --source-dir "$SE_BUILD_DIR/translated" --engine --output "$SE_BUILD_DIR/short-resource-rows-engine-zh.json"
          # Independent processes retain fresh per-render font state; await both failures too.
          ../tooling/.venv/bin/python ../english/scripts/probe_short_resources.py --source-dir "$SE_BUILD_DIR/en" --engine --output "$SE_BUILD_DIR/short-resources-engine-en.json" &
          SE_Q15_EN_PID=$!
          ../tooling/.venv/bin/python ../english/scripts/probe_short_resources.py --source-dir "$SE_BUILD_DIR/translated" --engine --output "$SE_BUILD_DIR/short-resources-engine-zh.json" &
          SE_Q15_ZH_PID=$!
          SE_Q15_STATUS=0
          wait "$SE_Q15_EN_PID" || SE_Q15_STATUS=1
          wait "$SE_Q15_ZH_PID" || SE_Q15_STATUS=1
          test "$SE_Q15_STATUS" -eq 0
          ../tooling/.venv/bin/python ../english/scripts/probe_preservation_reading.py --source-dir "$SE_BUILD_DIR/en" --output "$SE_BUILD_DIR/preservation-reading-engine-en.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_preservation_reading.py --source-dir "$SE_BUILD_DIR/translated" --output "$SE_BUILD_DIR/preservation-reading-engine-zh.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_storage_context.py --source-dir "$SE_BUILD_DIR/en" --output "$SE_BUILD_DIR/storage-context-engine-en.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_storage_context.py --source-dir "$SE_BUILD_DIR/translated" --output "$SE_BUILD_DIR/storage-context-engine-zh.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_q5_word_join.py --source-dir "$SE_BUILD_DIR/en" --output "$SE_BUILD_DIR/q5-word-join-engine-en.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_q5_word_join.py --source-dir "$SE_BUILD_DIR/translated" --output "$SE_BUILD_DIR/q5-word-join-engine-zh.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_metadata_gap_prose.py --source-dir "$SE_BUILD_DIR/en" --output "$SE_BUILD_DIR/metadata-gap-prose-engine-en.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_metadata_gap_prose.py --source-dir "$SE_BUILD_DIR/translated" --frozen tests/fixtures/metadata-0.3.36.zh-Hant.html.j2 --language chinese --output "$SE_BUILD_DIR/metadata-gap-prose-engine-zh.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_archive_gap_panels.py --source-dir "$SE_BUILD_DIR/en" --output "$SE_BUILD_DIR/archive-gap-engine-english.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_archive_gap_panels.py --source-dir "$SE_BUILD_DIR/translated" --output "$SE_BUILD_DIR/archive-gap-engine-chinese.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_identifier_spacing.py --source-dir "$SE_BUILD_DIR/translated" --output "$SE_BUILD_DIR/identifier-spacing-engine.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_word_short_budget.py --source-dir "$SE_BUILD_DIR/en" --output "$SE_BUILD_DIR/word-short-budget-english.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_word_short_budget.py --source-dir "$SE_BUILD_DIR/translated" --output "$SE_BUILD_DIR/word-short-budget-chinese.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_short_budget.py --source-dir "$SE_BUILD_DIR/en" --output "$SE_BUILD_DIR/short-budget-english.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_short_budget.py --source-dir "$SE_BUILD_DIR/translated" --output "$SE_BUILD_DIR/short-budget-chinese.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_empty_pdf.py --source-dir "$SE_BUILD_DIR/en" --output "$SE_BUILD_DIR/empty-pdf-probe-english.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_empty_pdf.py --source-dir "$SE_BUILD_DIR/translated" --output "$SE_BUILD_DIR/empty-pdf-probe-chinese.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_long_budget_word.py --output "$SE_BUILD_DIR/long-budget-word-probe.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_budget_pdf.py --output "$SE_BUILD_DIR/budget-pdf-probe.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_pdf_budget_reading.py --engine --output "$SE_BUILD_DIR/pdf-budget-reading-probe-english.json"
          ../tooling/.venv/bin/python ../english/scripts/probe_pdf_budget_reading.py --source-dir "$SE_BUILD_DIR/translated" --prior-question tests/fixtures/budget-0.3.18.zh-Hant.html.j2 --output "$SE_BUILD_DIR/pdf-budget-reading-probe-chinese.json"
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-candidate-not-a-release
          path: |
            zh/outputs/build-*/*.zip
            zh/outputs/build-*/manifest.json
            zh/outputs/build-*/*audit.json
            zh/outputs/build-*/storage-context-*.json
            zh/outputs/build-*/q5-word-join-*.json
            zh/outputs/build-*/metadata-gap-prose-*.json
            zh/outputs/build-*/output-profiles-scope.json
            zh/outputs/build-*/preservation-reading-*.json
            zh/outputs/build-*/short-resources-*.json
            zh/outputs/build-*/resource-prose-*.json
            zh/outputs/build-*/short-resource-rows-*.json
            zh/outputs/build-*/budget-grouping-*.json
            zh/outputs/build-*/identifier-spacing-engine.json
            zh/outputs/build-*/identifier-spacing-preflight.json
      - name: State acceptance boundary
        run: |
          echo 'Build checks do not establish full DMP, PDF or Microsoft Word acceptance. See docs/pilot-results.md.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Historic 0.3.34 Q5 failure is retained. The bounded 0.3.35 native fix and its remaining acceptance limits are documented in docs/q5-word-join.md.' >> "$GITHUB_STEP_SUMMARY"
